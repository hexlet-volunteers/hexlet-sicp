services:
  application:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/app:delegated
      - ~/.bash_history:/home/ubuntu/.bash_history:delegated
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: 5432
      TEST_DB_HOST: database
      TEST_DB_PORT: 5432
    command: ["make", "start-app"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/app:delegated
    ports:
      - 5173:5173
    command: ["make", "start-frontend"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - 54320:5432
    volumes:
      - hexlet-sicp-pgdata:/var/lib/postgresql
      - ./database/docker:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  hexlet-sicp-pgdata:
