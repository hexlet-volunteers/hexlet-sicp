name: CI

# Пуш в не-main ветки намеренно не триггерит: PR из ветки этого же репозитория
# прогонялся бы дважды — и на push, и на pull_request.
on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

# В PR новый пуш отменяет устаревший прогон. Прогоны main не отменяем:
# каждый из них заливает свой launch в TestOps.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Адрес TestOps и id проекта — не секреты: адрес лежит открытым текстом в
# .mcp.json, id проекта — в docs/adr/0005 и docs/testops-manual-names.md.
# Держать их в секретах значило бы настраивать CI на значения, которые никто
# не может перечитать глазами. Секрет здесь только токен.
env:
  ALLURE_ENDPOINT: https://hexlet.testops.cloud
  ALLURE_PROJECT_ID: "100"
  # Обязателен, дефолта у allurectl нет. Дублированием пути из адаптера это
  # только кажется: дефолт адаптера говорит, куда PHPUnit пишет результаты
  # внутри контейнера, а ALLURE_RESULTS — откуда allurectl читает их на
  # раннере. Без него watch создаёт launch и заливает в него ноль файлов,
  # причём прогон остаётся зелёным.
  ALLURE_RESULTS: build/allure-results
  # Compose собирает через buildx bake, а тот с v0.38 требует --allow=fs.* для
  # кэша в /tmp/.docker-cache вне контекста. У docker compose build такого флага
  # нет, поэтому проверку выключаем.
  BUILDX_BAKE_ENTITLEMENTS_FS: "0"

jobs:
  # Статическая проверка воркфлоу: синтаксис, выражения, входы actions,
  # инъекции в run:, закрепление actions на SHA (#2071).
  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/jactionlint@a65ab044e916760429068fe5794b8306abdfcbb9 # v2.3.0

  # Секреты во всей истории git (#2071): вся история сканируется за секунды,
  # поэтому каждый прогон проверяет её целиком. Ложные находки — в .betterleaksignore.
  betterleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Action у betterleaks нет. Ставим стабильную ветку v1 (v2 пока в RC) из
      # релиза с проверкой sha256 из checksums.txt; при обновлении менять обе строки.
      - name: Install betterleaks
        env:
          VERSION: 1.9.0
          SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
        run: |
          curl -sSfL -o betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${VERSION}/betterleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  betterleaks.tar.gz" | sha256sum -c -
          tar -xzf betterleaks.tar.gz -C "$RUNNER_TEMP" betterleaks
      - name: Scan git history for secrets
        run: '"$RUNNER_TEMP/betterleaks" git . --redact --no-banner'

  build:
    runs-on: ubuntu-latest
    # Обычный прогон — около 5 минут, сборка образа без кэша — до 45.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Кэш Docker слоёв
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.docker-cache
          key: docker-${{ hashFiles('Dockerfile.dev', 'xdebug.ini') }}
          restore-keys: |
            docker-

      # Загрузочные кэши composer и pnpm. Кэш слоёв их не покрывает:
      # composer install и pnpm install выполняются в рантайме, а не при сборке образа.
      - name: Cache PHP and JS dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .composer-cache
            .pnpm-store
          key: deps-${{ hashFiles('composer.lock', 'pnpm-lock.yaml') }}
          restore-keys: |
            deps-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Заливаем только прогоны main: в отчёте для команды предмет — состояние
      # main, а launch'и по PR разбавили бы историю каждого тест-кейса кодом,
      # который в main не попал.
      - name: Set up allurectl
        if: github.event_name == 'push'
        uses: allure-framework/setup-allurectl@2d89ee0b7ba2f59dbe9849b6df5763cab78e14db # v1.0.3
        with:
          allure-endpoint: ${{ env.ALLURE_ENDPOINT }}
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: ${{ env.ALLURE_PROJECT_ID }}

      # `allurectl watch` оборачивает всю команду: он создаёт launch, ждёт
      # завершения, забирает build/allure-results и возвращает исходный код
      # выхода. Поэтому заливка происходит и при падении тестов, и отдельный
      # шаг с `if: always()` не нужен.
      - name: Run CI
        env:
          UPLOAD_TO_TESTOPS: ${{ github.event_name == 'push' }}
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: |
          # Каталог создаём заранее: watch начинает индексировать сразу, а
          # контейнер напишет туда первые файлы только через минуту.
          mkdir -p "$ALLURE_RESULTS"
          # Контейнер работает под uid владельца checkout'а — иначе git внутри
          # отказывается работать с репозиторием («dubious ownership»).
          # UID в bash есть, но не экспортируется; docker-compose.ci.yml берёт его как build-arg.
          export UID
          if [ "$UPLOAD_TO_TESTOPS" = "true" ]; then
            allurectl watch \
              --launch-name "main #${{ github.run_number }} $(git rev-parse --short HEAD)" \
              -- make ci
          else
            make ci
          fi

      # Страж против того, что уже случилось один раз: без ALLURE_RESULTS
      # allurectl создал launch, залил в него ноль файлов и вернул успех, так
      # что зелёная сборка ничего не говорила о заливке. Проверяем только на
      # зелёном прогоне: на красном отсутствие результатов может быть
      # следствием падения сборки, и вторая ошибка лишь запутает.
      - name: Check that test results were produced
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          count=$(find "$ALLURE_RESULTS" -name '*-result.json' | wc -l)
          echo "файлов результатов: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::$ALLURE_RESULTS пуст — в TestOps уехал пустой launch"
            exit 1
          fi

      - name: Move Docker cache
        if: always()
        run: |
          if [ -d /tmp/.docker-cache-new ]; then
            rm -rf /tmp/.docker-cache
            mv /tmp/.docker-cache-new /tmp/.docker-cache
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/logs/clover.xml
